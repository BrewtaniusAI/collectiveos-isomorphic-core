name: OIMS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governed-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit and conformance tests
        run: python -m unittest discover -v
      - name: Fixture family smoke
        run: >-
          python -m oims
          --artifacts-dir artifacts-smoke
          family
          --backend fixture
          --prompt "CI family conformance probe"
      - name: Validate emitted JSON
        run: python -m json.tool artifacts-smoke/conformance_report.jsonld > /dev/null
