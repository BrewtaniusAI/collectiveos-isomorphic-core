name: OIMS CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  governed-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact reviewed source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements/ci.lock
          python -m pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and conformance tests
        run: |
          python -m unittest discover -v
          pytest -q
      - name: Validate Collective skill packages
        run: python tools/validate_skills.py --json
      - name: Fixture family smoke
        run: >-
          python -m oims
          --artifacts-dir artifacts-smoke
          mesh
          --backend fixture
          --prompt "CI heterogeneous family conformance probe"
      - name: Verify family receipt
        run: python -m oims verify --path artifacts-smoke/conformance_report.jsonld
      - name: CollectiveOS role smoke
        run: >-
          python -m oims
          --artifacts-dir artifacts-smoke
          collective
          --backend fixture
          --agent Giles
          --prompt "CI role-binding probe"
      - name: Validate machine-readable scope
        run: python -m json.tool SCOPE_MATRIX.json > /dev/null
