family: OIMS-Qwen2.5
version: "2.0"
preconditions:
  input_must_be_string: true
  input_max_length: 2048
  empty_input: idle
invariants:
  lawful_states:
    - LAWFUL
    - IDLE
  max_runtime_drift: 0.05
  require_nonempty_output: true
  require_pinned_weight_revision: true
  require_shared_contract_hash: true
governance:
  hard_fail:
    - input_not_string
    - input_too_long
    - empty_model_output
    - unpinned_weight_revision
  soft_warn:
    - empty_input
recovery:
  on_hard_fail: DIGITAL_APOPTOSIS
  on_soft_warn: IDLE
